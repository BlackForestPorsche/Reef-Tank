; Sightglass — Guition / Sunton ESP32-S3-4848S040
; SKU: 4" 480x480 ST7701 RGB + GT911, no-relay.
; Factory / you flash this. Customers never open PlatformIO.
;
; Default env is SoftAP + HTTP + ArduinoJson only. It must compile on
; espressif32 Arduino without Arduino_GFX / LVGL / GT911.
; Optional env `esp32-s3-panel-lvgl` is the next flash-on-glass step.

[platformio]
default_envs = esp32-s3-panel

[env:esp32-s3-panel]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; ESP32-S3-N16R8: 16 MB QIO flash, 8 MB OPI PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
  ; Most 4848S040 boards expose UART0 via CH340 on USB-C. Set to 1 if your
  ; unit is native USB-CDC instead.
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  -I include
  ; Optional factory override, no secrets in source:
  ; -DHUB_BASE_DEFAULT=\"http://192.168.1.10:43180\"
  ; -DAPEX_HOST_DEFAULT=\"192.168.1.50\"

lib_deps =
  bblanchon/ArduinoJson@^7.3.0

; If another env's libs land in this libdeps folder, do not compile them.
lib_ignore =
  lvgl
  GFX Library for Arduino
  TAMC_GT911

[env:esp32-s3-panel-lvgl]
extends = env:esp32-s3-panel
build_flags =
  ${env:esp32-s3-panel.build_flags}
  -DREEFDECK_HAS_DISPLAY
  -DLV_CONF_INCLUDE_SIMPLE
lib_deps =
  ${env:esp32-s3-panel.lib_deps}
  lvgl/lvgl@^8.4.0
  moononournation/GFX Library for Arduino@^1.4.7
  https://github.com/tamctec/gt911-arduino.git
lib_ignore =
lib_archive = no
